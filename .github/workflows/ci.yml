name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  windows:
    name: Windows (required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo xtask deps
      - run: cargo tree -p weftora-player --edges normal,build --locked
      - run: cargo xtask docs
      - name: Build Windows preview
        run: cargo build -p weftora-cli -p weftora-player --locked
      - name: Package and validate Windows preview
        shell: pwsh
        run: |
          .\target\debug\weftora.exe export examples/hello-story --out target/windows-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\windows-preview\weftora-player.exe target/windows-preview/story --validate
      - uses: actions/upload-artifact@v4
        with:
          name: weftora-windows-preview-${{ github.sha }}
          path: target/windows-preview/
          retention-days: 14

  deny:
    name: Dependencies (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: EmbarkStudios/cargo-deny-action@v2
        # The action uses all features; deny.toml matches this for local runs.
        with:
          command: check

  macos-headless:
    name: macOS headless (non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p weftora-api -p weftora-core -p weftora-story -p weftora-yarn -p weftora-yarn-compiler
      - run: cargo xtask deps
