[package]
name = "weftora-render-bevy"
description = "Bevy adapter: window, background, text, choices and audio for the Weftora player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Authored Story scenarios are separate from the standalone Engine suite.
story-tests = []

[dependencies]
weftora-api.workspace = true
weftora-core.workspace = true
weftora-story.workspace = true
weftora-yarn.workspace = true
weftora-save.workspace = true
bevy = { workspace = true, features = ["wav"] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "tracing", "hound", "lewton"] }

serde_json.workspace = true

image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
weftora-yarn-compiler.workspace = true
