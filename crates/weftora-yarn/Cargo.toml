[package]
name = "weftora-yarn"
description = "Yarn runtime and compiled artifacts on canonical Weftora state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
weftora-api.workspace = true
weftora-core.workspace = true
weftora-save.workspace = true
weftora-story.workspace = true
weftora-script.workspace = true
yarnspinner_core.workspace = true
yarnspinner_runtime.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10"
prost = "0.14"
thiserror.workspace = true
# Only for the `HashMap` type that yarnspinner's `VariableStorage` trait names; keep in step with yarnspinner.
bevy_platform = { version = "0.19", default-features = false, features = ["alloc"] }

[build-dependencies]
sha2 = "0.10"

[lints]
workspace = true
