[package]
name = "weftora-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "weftora"
path = "src/main.rs"

[[test]]
name = "story_a"
path = "tests/story_a.rs"
required-features = ["story-tests"]

[[test]]
name = "life_sim"
path = "tests/life_sim.rs"
required-features = ["story-tests"]

[[test]]
name = "story_matrix"
path = "tests/story_matrix.rs"
required-features = ["story-tests"]

[features]
# Authored Story scenarios are separate from the standalone Engine suite.
story-tests = []

[dependencies]
weftora-api.workspace = true
weftora-core.workspace = true
weftora-save.workspace = true
weftora-story.workspace = true
weftora-yarn.workspace = true
weftora-yarn-compiler.workspace = true
tempfile = "3"
serde_json.workspace = true
sha2 = "0.10"


[lints]
workspace = true
