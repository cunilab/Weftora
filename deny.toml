[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0249", reason = "smartstring: mandatory Rhai 1.26.1 dependency, all versions unmaintained with no fixed upgrade; bounded host isolates use; re-evaluate on Rhai upgrades (ADR 0010)" },
    { id = "RUSTSEC-2024-0384", reason = "instant: via antlr-rust in yarnspinner_compiler; authoring-only compiler; player dependency guard excludes it (P2-03); no upgrade available" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via winit's Linux Wayland decorations (sctk-adwaita), not used on Windows; no upgrade available" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
